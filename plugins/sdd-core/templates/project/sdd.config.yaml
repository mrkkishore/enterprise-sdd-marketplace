# Enterprise SDD project configuration. Generated by /sdd-core:sdd-init. Reviewed by the tech lead.
framework:
  core: sdd-core@enterprise-sdd
  core_version: 1.0.0

project:
  id: PROJ
  name: Example Modernization
  mode: brownfield              # greenfield | brownfield
  data_classification: confidential
  owner_team: example-team

gates:
  profile: standard             # lite | standard | regulated
  coverage_min: 80
  max_checker_loops: 3

packs:
  target: pack-nodejs-lambda
  source: pack-java-ejb-legacy  # brownfield only
  domain: []                    # optional team domain packs

# Slot -> skill mapping. Agents load these skills. Values come from each pack's PACK.yaml.
slots:
  stack-coding-standards: pack-nodejs-lambda:coding-standards
  stack-project-setup: pack-nodejs-lambda:project-setup
  stack-api-patterns: pack-nodejs-lambda:api-patterns
  stack-data-access: pack-nodejs-lambda:data-access-oracle
  stack-testing: pack-nodejs-lambda:testing
  stack-security-integration: pack-nodejs-lambda:security-entra-id
  stack-observability: pack-nodejs-lambda:observability
  stack-deployment: pack-nodejs-lambda:deployment-sam-cdk
  legacy-analysis: pack-java-ejb-legacy:legacy-analysis
  legacy-to-target-mapping: pack-java-ejb-legacy:ejb-to-nodejs-mapping
  semantic-parity: pack-java-ejb-legacy:financial-semantic-parity

commands:                       # used by checkers to produce evidence; adjust per stack
  build: npm run build
  test: npm test -- --coverage
  lint: npm run lint
  sast: npx eslint . --max-warnings=0
  sca: npm audit --audit-level=high
  secrets: gitleaks detect --no-git --redact --config .gitleaks.toml
  perf: npm run test:perf

paths:
  src: src/
  tests: tests/
  legacy: ../legacy-app/        # brownfield: read-only reference checkout

approvers:                      # git author emails allowed to sign approvals, by role
  product_owner: [po@example.com]
  business_sme: [sme@example.com]
  solution_architect: [architect@example.com]
  security_architect: [security@example.com]
  data_owner: [data.owner@example.com]
  release_manager: [release@example.com]
